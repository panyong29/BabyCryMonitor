name: Build Windows EXE & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 精简版：exe 里不再打包 ffmpeg 和 YAMNet 模型（见 README 精简版一节），
      # 只打包类别映射表（很小）；ffmpeg 和模型由使用者自己下载、放 exe 旁。
      - name: Build EXE
        shell: pwsh
        run: >
          pyinstaller --onefile --windowed --name BabyCryMonitor
          --add-data "assets/yamnet_class_map.csv;assets"
          cry_monitor.py

      # 只有打 v* tag 才发 release（版本号就是 tag 名，如 v2.0.0）；
      # 平时 push 到 main 只验证构建能过，不再自动发 build-N 的 release。
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BabyCryMonitor.exe
          tag_name: ${{ github.ref_name }}
          name: BabyCryMonitor ${{ github.ref_name }}
          generate_release_notes: false
