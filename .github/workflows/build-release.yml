name: Build Windows EXE & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 精简版：exe 里不再打包 ffmpeg 和 YAMNet 模型（见 README 精简版一节），
      # 只打包类别映射表（很小）；ffmpeg 和模型由使用者自己下载、放 exe 旁。
      # 真正瘦身：imageio-ffmpeg 包自带 ffmpeg.exe，PyInstaller 会把它当包数据
      # 一起收进 exe（v2.1.0 的 72.9MB 里它占了 38.7MB）。构建前删掉，
      # 之后 ffmpeg 必须由使用者自己下载（README 安装一节）。
      - name: Strip bundled ffmpeg binary
        shell: pwsh
        run: |
          $pkg = python -c "import imageio_ffmpeg, os; print(os.path.dirname(imageio_ffmpeg.__file__))"
          Get-ChildItem -Path "$pkg\binaries" -Filter *.exe -ErrorAction SilentlyContinue | Remove-Item -Force
          if (Test-Path "$pkg\binaries") { Get-ChildItem -Path "$pkg\binaries" }

      - name: Build EXE
        shell: pwsh
        run: >
          pyinstaller --onefile --windowed --name BabyCryMonitor
          --add-data "assets/yamnet_class_map.csv;assets"
          cry_monitor.py

      # 只有打 v* tag 才发 release（版本号就是 tag 名，如 v2.0.0）；
      # 平时 push 到 main 只验证构建能过，不再自动发 build-N 的 release。
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BabyCryMonitor.exe
          tag_name: ${{ github.ref_name }}
          name: BabyCryMonitor ${{ github.ref_name }}
          generate_release_notes: false
